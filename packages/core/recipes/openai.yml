id: openai
ground: "#FFFFFF"
ink: "#111111"
muted: "#8E8EA0"
font: "OpenAI Sans, Sohne, Geist, ui-sans-serif"
ease_in_view: "cubic-bezier(0.16, 1, 0.3, 1)"
ease_out_view: "cubic-bezier(0.4, 0, 1, 1)"
enter:
  preset: rise
  scale_from: 0.96
  fade: true
  duration: 0.32
hold_min: 0.8
scene_transition: cut
point:
  r: 8
  pulse:
    duration: 1.6
    scale: [1, 1.08, 1]
    loop: true
